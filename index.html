<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ALBE PRESUPUESTOS PRO</title>

<link rel="stylesheet" href="Estilo.css">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#005baa">

</head>

<body>

<div class="contenedor">

<header>

<img src="logo.png" class="logo">

<h1>ALBE SERVICIOS GENERALES</h1>

<h2>Sistema de Presupuestos</h2>

</header>

<section class="clientes">

<h3>Seleccione Cliente</h3>

<button id="btnOncity" class="oncity">

ON CITY

</button>

<button id="btnCredito" class="credito">

CRÉDITO ARGENTINO

</button>

</section>

<section>

<h3>Datos del Presupuesto</h3>

<div class="grid">

<div>

<label>N° Agenda</label>

<input type="text" id="agenda">

</div>

<div>

<label>Fecha</label>

<input type="date" id="fecha">

</div>

<div>

<label>Cliente</label>

<input type="text" id="cliente" readonly>

</div>

<div>

<label>Sucursal</label>

<select id="sucursal">

<option value="">Seleccione...</option>

</select>

</div>

<div>

<label>Provincia</label>

<select id="provincia">

<option value="">Seleccione...</option>

</select>

</div>

<div>

<label>Localidad</label>

<select id="localidad">

<option value="">Seleccione...</option>

</select>

</div>

<div>

<label>Dirección</label>

<input type="text" id="direccion" readonly>

</div>

<div>

<label>Lugar del Trabajo</label>

<input type="text" id="lugar">

</div>

<div>

<label>Supervisor</label>

<input type="text" id="supervisor">

</div>

</div>

</section>

<section>

<h3>Descripción del Trabajo</h3>

<textarea
id="descripcion"
rows="6"></textarea>

</section>
<section>

<h3>Materiales</h3>

<button type="button" id="agregarMaterial">
+ Agregar Material
</button>

<table>

<thead>

<tr>
<th>Descripción</th>
<th>Cantidad</th>
<th>Precio Unitario</th>
<th>Subtotal</th>
<th></th>
</tr>

</thead>

<tbody id="materialesBody">

</tbody>

<tfoot>

<tr>

<td colspan="3"><strong>Total Materiales</strong></td>

<td id="totalMateriales">$0</td>

<td></td>

</tr>

</tfoot>

</table>

</section>
<section>

<h3>Mano de Obra</h3>

<button type="button" id="agregarMano">
+ Agregar Trabajo
</button>

<table>

<thead>

<tr>
<th>Descripción</th>
<th>Cantidad</th>
<th>Precio Unitario</th>
<th>Subtotal</th>
<th></th>
</tr>

</thead>

<tbody id="manoBody">

</tbody>

<tfoot>

<tr>

<td colspan="3"><strong>Total Mano de Obra</strong></td>

<td id="totalMano">$0</td>

<td></td>

</tr>

</tfoot>

</table>

</section>
