<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ALBE - Clientes V4.0</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#ececec;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,.12);
}

h1{
    text-align:center;
    margin-bottom:25px;
}

h2{
    margin-bottom:20px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    font-weight:bold;
}

select,
input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:16px;
    background:white;
}

select:focus,
input:focus{
    outline:none;
    border-color:#333;
}

button{
    width:100%;
    padding:13px;
    margin-top:20px;
    border:none;
    border-radius:7px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
}

.btn-volver{
    background:#333;
    color:white;
}

.cliente-item{
    margin-top:15px;
    padding:15px;
    border:1px solid #ddd;
    border-radius:8px;
    background:#f8f8f8;
}

.cliente-item strong{
    display:block;
    font-size:17px;
}

.cliente-item span{
    display:block;
    margin-top:5px;
}

.cliente-item small{
    display:block;
    margin-top:5px;
    color:#666;
}

.info{
    margin-top:20px;
    padding:15px;
    background:#f1f1f1;
    border-radius:8px;
}

</style>

</head>

<body>

<div class="container">

    <h1>ALBE PRESUPUESTOS V4.0</h1>

    <section id="cliente">

        <h2>Seleccionar Cliente</h2>

        <!-- EMPRESA -->

        <label for="empresaCliente">
            Empresa
        </label>

        <select id="empresaCliente">

            <option value="">
                Seleccione empresa...
            </option>

        </select>


        <!-- PROVINCIA -->

        <label for="provinciaCliente">
            Provincia
        </label>

        <select id="provinciaCliente">

            <option value="">
                Seleccione provincia...
            </option>

        </select>


        <!-- LOCALIDAD -->

        <label for="localidadCliente">
            Localidad
        </label>

        <select id="localidadCliente">

            <option value="">
                Seleccione localidad...
            </option>

        </select>


        <!-- SUCURSAL -->

        <label for="sucursalCliente">
            Sucursal
        </label>

        <select id="sucursalCliente">

            <option value="">
                Seleccione sucursal...
            </option>

        </select>


        <!-- DIRECCIÓN -->

        <label for="direccionCliente">
            Dirección
        </label>

        <input
            type="text"
            id="direccionCliente"
            placeholder="Dirección"
            readonly
        >


        <!-- TELÉFONO -->

        <label for="telefonoCliente">
            Teléfono
        </label>

        <input
            type="text"
            id="telefonoCliente"
            placeholder="Teléfono"
            readonly
        >


        <!-- INFORMACIÓN -->

        <div class="info">

            <strong>
                Datos de la sucursal
            </strong>

            <div id="datosSucursal">
                Seleccione una sucursal.
            </div>

        </div>


        <!-- LISTA DE CLIENTES -->

        <div id="listaClientes"></div>


        <!-- VOLVER -->

        <button
            class="btn-volver"
            onclick="history.back()"
        >
            ← Volver
        </button>

    </section>

</div>


<!-- ==========================================
     JAVASCRIPT V4.0
========================================== -->

<script src="clientes.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function(){

        const sucursal =
            document.getElementById(
                "sucursalCliente"
            );

        if(sucursal){

            sucursal.addEventListener(
                "change",
                function(){

                    const datos =
                        document.getElementById(
                            "datosSucursal"
                        );

                    if(!this.value){

                        datos.textContent =
                            "Seleccione una sucursal.";

                        return;

                    }

                    try{

                        const s =
                            JSON.parse(this.value);

                        datos.innerHTML = `
                            <strong>${s.sucursal}</strong><br>
                            ${s.direccion || "Sin dirección cargada"}<br>
                            ${s.telefono || "Sin teléfono cargado"}
                        `;

                    }catch(error){

                        datos.textContent =
                            "Error leyendo la sucursal.";

                    }

                }
            );

        }

    }
);

</script>


</body>
</html>
