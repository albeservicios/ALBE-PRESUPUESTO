<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Clientes</title>

<link rel="stylesheet" href="Estilo.css">

</head>

<body>

<div class="dashboard">

<h1>👥 Gestión de Clientes</h1>

<button onclick="location.href='index.html'">
🏠 Inicio
</button>

<hr>

<h2>Datos del Cliente</h2>

<label>Empresa</label>

<select id="empresa">

<option value="">Seleccione...</option>

<option>ON CITY</option>

<option>CRÉDITO ARGENTINO</option>

<option>PARTICULAR</option>

<option>OTRO</option>

</select>

<label>Sucursal</label>

<input
type="text"
id="sucursal">

<label>Contacto</label>

<input
type="text"
id="contacto">

<label>Teléfono</label>

<input
type="text"
id="telefono">

<label>Correo</label>

<input
type="email"
id="correo">

<label>Provincia</label>

<input
type="text"
id="provincia">

<label>Localidad</label>

<input
type="text"
id="localidad">

<label>Dirección</label>

<input
type="text"
id="direccion">

<label>Observaciones</label>

<textarea
id="observaciones"
rows="4"></textarea>

<hr>
  <h2>Acciones</h2>

<button id="btnGuardar">
💾 Guardar Cliente
</button>

<button id="btnNuevo">
➕ Nuevo
</button>

<button id="btnEditar">
✏️ Editar
</button>

<button id="btnEliminar">
🗑️ Eliminar
</button>

<button id="btnBuscar">
🔍 Buscar
</button>

<hr>

<h2>Clientes Registrados</h2>

<input
type="text"
id="buscarCliente"
placeholder="Buscar por empresa, sucursal o localidad">

<br><br>

<table id="tablaClientes">

<thead>

<tr>

<th>Empresa</th>
<th>Sucursal</th>
<th>Contacto</th>
<th>Teléfono</th>
<th>Provincia</th>
<th>Localidad</th>

</tr>

</thead>

<tbody id="clientesBody">

</tbody>

</table>

</div>

<script src="clientes.js"></script>

</body>

</html>
