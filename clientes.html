<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Clientes - ALBE SERVICIOS GENERALES</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>👥 Gestión de Clientes</h1>

<button onclick="location.href='index.html'">
🏠 Volver al Inicio
</button>

<hr>

<h2>Nuevo Cliente</h2>

<label>Empresa</label>

<select id="empresa">

<option value="">Seleccione...</option>

<option>ON CITY</option>

<option>CRÉDITO ARGENTINO</option>

<option>PARTICULAR</option>

<option>OTRO</option>

</select>

<label>Sucursal</label>
<input type="text" id="sucursal">

<label>Contacto</label>
<input type="text" id="contacto">

<label>Teléfono</label>
<input type="text" id="telefono">

<label>Correo</label>
<input type="email" id="correo">

<label>Provincia</label>
<input type="text" id="provincia">

<label>Localidad</label>
<input type="text" id="localidad">

<label>Dirección</label>
<input type="text" id="direccion">

<label>Observaciones</label>
<textarea id="observaciones"></textarea>

<br><br>
  <hr>

<h2>Acciones</h2>

<button id="btnGuardarCliente">
💾 Guardar Cliente
</button>

<button id="btnNuevoCliente">
➕ Nuevo
</button>

<button id="btnBuscarCliente">
🔍 Buscar
</button>

<button id="btnEliminarCliente">
🗑 Eliminar
</button>

<hr>

<h2>Clientes Registrados</h2>

<table id="tablaClientes">

<thead>

<tr>

<th>Empresa</th>
<th>Sucursal</th>
<th>Contacto</th>
<th>Teléfono</th>
<th>Localidad</th>

</tr>

</thead>

<tbody id="clientesBody">

</tbody>

</table>

</div>

<script src="clientes.js"></script>

</body>

</html>
