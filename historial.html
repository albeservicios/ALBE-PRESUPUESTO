<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Historial de Presupuestos</title>

<link rel="stylesheet" href="Estilo.css">

</head>

<body>

<div class="dashboard">

<h1>📂 Historial de Presupuestos</h1>

<button onclick="location.href='index.html'">
🏠 Volver al Inicio
</button>

<hr>

<h2>Buscar Presupuesto</h2>

<input
type="text"
id="buscar"
placeholder="Buscar por agenda, empresa, sucursal o localidad">

<hr>

<h2>Presupuestos Guardados</h2>

<table id="tablaHistorial">

<thead>

<tr>

<th>Agenda</th>

<th>Fecha</th>

<th>Empresa</th>

<th>Sucursal</th>

<th>Provincia</th>

<th>Localidad</th>

<th>Total</th>

</tr>

</thead>

<tbody id="historialBody">

</tbody>

</table>

<hr>
<h2>Acciones</h2>

<button id="btnAbrir">
📂 Abrir Presupuesto
</button>

<button id="btnDuplicar">
📑 Duplicar
</button>

<button id="btnEliminar">
🗑️ Eliminar
</button>

<button id="btnImprimir">
🖨️ Imprimir
</button>

<hr>

</div>

<script src="historial.js"></script>

</body>

</html>
